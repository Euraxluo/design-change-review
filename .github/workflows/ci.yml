name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check scripts
        run: |
          for f in scripts/*.mjs; do node --check "$f" || exit 1; done
      - name: Syntax check runtime
        run: node --check assets/runtime.js

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          for f in SKILL.md README.md CHANGELOG.md LICENSE references/workflow.md references/spec-format.md; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
          done
      - name: No stray artifacts committed
        run: |
          ! git ls-files | grep -E 'node_modules|\.DS_Store|/preview\.html$'

  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build minimal spec
        run: |
          mkdir -p /tmp/smoke
          echo '{"title":"smoke","pages":[{"id":"p1","name":"P","root":{"id":"r1","type":"frame","children":[]},"change":"modified"}],"flows":[],"backend":[],"questions":[]}' > /tmp/smoke/spec.json
          node scripts/build.mjs /tmp/smoke/spec.json -o /tmp/smoke/preview.html
          node scripts/build.mjs /tmp/smoke/spec.json --check
      - name: Build with replica anchors
        run: |
          mkdir -p /tmp/smoke2
          cat > /tmp/smoke2/spec.json <<'SPEC'
          {"title":"smoke2","pages":[{"id":"p1","name":"P","change":"modified","width":900,
            "root":{"id":"r1","type":"frame","children":[
              {"id":"sec1","type":"container","label":"列表","change":"modified","before":{"label":"旧列表"},"children":[]}
            ]},
            "htmlBefore":"<div data-replica-unit=\"sec1\">旧内容</div>",
            "htmlAfter":"<div data-replica-unit=\"sec1\">新内容</div>",
            "htmlCss":".x{color:red}"}],
           "flows":[],"backend":[],"questions":[]}
          SPEC
          node scripts/build.mjs /tmp/smoke2/spec.json -o /tmp/smoke2/preview.html
          grep -q "data-unit-n" /tmp/smoke2/preview.html && echo "badge injected ✔"
      - name: Validator rejects bad spec
        run: |
          mkdir -p /tmp/bad
          echo '{"title":"bad","pages":[{"id":"p1","name":"P","root":{"id":"r1","type":"frame","children":[{"id":"dup","type":"text"},{"id":"dup","type":"text"}]}}],"flows":[],"backend":[]}' > /tmp/bad/spec.json
          if node scripts/build.mjs /tmp/bad/spec.json -o /tmp/bad/preview.html; then
            echo "ERROR: duplicate ids should fail"; exit 1
          else
            echo "duplicate ids rejected ✔"
          fi

      - name: Format redline R1 blocks modified page without in-tree screenshot
        run: |
          mkdir -p /tmp/r1
          echo '{"title":"r1","stage":"prototype","pages":[{"id":"a","name":"A","change":"modified","note":"x","root":{"id":"a-r","type":"page","change":"modified","note":"y","children":[{"id":"a1","type":"button","label":"b","change":"added"}]}}],"flows":[],"backend":[]}' > /tmp/r1/spec.json
          if node scripts/build.mjs /tmp/r1/spec.json -o /tmp/r1/preview.html 2>/tmp/r1/err.txt; then
            echo "ERROR: R1 should block"; exit 1
          else
            grep -q "格式红线R1" /tmp/r1/err.txt && echo "R1 blocks ✔"
          fi
      - name: Format redline R1 passes with image node; R2 warns when 3+ changed pages lack context page
        run: |
          mkdir -p /tmp/r2
          cat > /tmp/r2/spec.json <<'SPEC'
          {"title":"r2","stage":"prototype","pages":[
            {"id":"a","name":"A","change":"modified","note":"x","root":{"id":"a-r","type":"page","change":"modified","note":"y","children":[{"id":"a-img","type":"image","label":"shot","src":"evidence/current-pages/a.png"},{"id":"a1","type":"button","label":"b","change":"added"}]}},
            {"id":"b","name":"B","change":"modified","note":"x","root":{"id":"b-r","type":"page","change":"modified","note":"y","children":[{"id":"b-img","type":"image","label":"shot","src":"evidence/current-pages/b.png"},{"id":"b1","type":"button","label":"c","change":"added"}]}},
            {"id":"c","name":"C","change":"added","root":{"id":"c-r","type":"page","children":[]}}],"flows":[],"backend":[]}
          SPEC
          node scripts/build.mjs /tmp/r2/spec.json -o /tmp/r2/preview.html 2>&1 | tee /tmp/r2/out.txt
          grep -q "格式红线R2" /tmp/r2/out.txt && echo "R2 warns ✔"
      - name: R7 htmlOverlay-only overlay renders canvas skeleton + demo shortcut (runtime-smoke covers click path)
        run: |
          mkdir -p /tmp/ovt
          cat > /tmp/ovt/spec.json <<'SPEC'
          {"title":"r7","stage":"prototype","version":1,"pages":[{"id":"pg","name":"PG","route":"/pg","change":"modified","note":"x","width":900,
            "root":{"id":"r","type":"page","change":"modified","note":"y","children":[{"id":"shot","type":"image","label":"s","src":"evidence/current-pages/a.png"},{"id":"card1","type":"card","label":"点我","change":"added"}]},
            "overlays":[{"id":"ov1","type":"drawer","name":"详情","trigger":"card1","change":"added","note":"n","htmlOverlay":"<div>真实内容标题</div>"}]}],"flows":[],"backend":[]}
          SPEC
          node scripts/build.mjs /tmp/ovt/spec.json -o /tmp/ovt/preview.html 2>&1 | tee /tmp/ovt/out.txt
          grep -q "htmlOverlay 没有 wireframe children" /tmp/ovt/out.txt && echo "R7 build warning fires ✔"
          grep -q "在演示里看内容" /tmp/ovt/preview.html && echo "R7 canvas fallback present in preview ✔"
      - name: Format redline R6 blocks new spec whose routes an unimplemented sibling prototype already covers
        run: |
          mkdir -p /tmp/jdr/20260101-old/design /tmp/jdr/20260102-new/design
          echo '{"title":"old","stage":"prototype","version":9,"pages":[{"id":"m","name":"M","route":"/market","change":"modified","note":"x","root":{"id":"m-r","type":"page","children":[{"id":"m-img","type":"image","src":"evidence/current-pages/m.png"}]}}],"flows":[],"backend":[]}' > /tmp/jdr/20260101-old/design/spec.json
          echo '{"title":"new","stage":"prototype","version":1,"pages":[{"id":"m2","name":"M2","route":"/market","change":"modified","note":"y","root":{"id":"m2-r","type":"page","children":[{"id":"m2-img","type":"image","src":"evidence/current-pages/m2.png"}]}}],"flows":[],"backend":[]}' > /tmp/jdr/20260102-new/design/spec.json
          if node scripts/build.mjs /tmp/jdr/20260102-new/design/spec.json -o /tmp/jdr/20260102-new/design/preview.html 2>/tmp/r6err.txt; then
            echo "ERROR: R6 should block cross-dir route conflict"; exit 1
          else
            grep -q "格式红线R6" /tmp/r6err.txt && echo "R6 blocks cross-dir conflict ✔"
          fi
          node scripts/build.mjs /tmp/jdr/20260102-new/design/spec.json -o /tmp/jdr/20260102-new/design/preview.html --no-lint-siblings >/dev/null && echo "R6 exemption flag works ✔"
      - name: embed.mjs exits nonzero on missing evidence; discovers evidence next to preview by default
        run: |
          mkdir -p /tmp/emb/evidence/current-pages
          echo '"src":"evidence/current-pages/nope.png"' > /tmp/emb/preview.html
          if node scripts/embed.mjs /tmp/emb/preview.html 2>/tmp/emb/err.txt; then
            echo "ERROR: embed should fail on missing evidence"; exit 1
          else
            grep -q "未找到" /tmp/emb/err.txt && echo "embed blocks on missing evidence ✔"
          fi
          printf '\x89PNG\r\n\x1a\n' > /tmp/emb/evidence/current-pages/nope.png
          node scripts/embed.mjs /tmp/emb/preview.html | grep -q "内嵌截图 1 张" && echo "embed default-root discovery ✔"

  wrap-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: wrap-archify helps without input
        run: |
          node scripts/wrap-archify.mjs 2>&1 | grep -q "用法" && echo "usage ok ✔"

  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build demo example
        run: |
          node scripts/build.mjs examples/demo-review/spec.json -o /tmp/demo-preview.html
      - name: Install chromium
        run: |
          cd /tmp && npm init -y >/dev/null && npm i playwright-core >/dev/null
          npx playwright-core install --with-deps chromium
      - name: Open preview, assert tabs + no pageerror
        run: |
          cat > /tmp/smoke.mjs <<'SMOKE'
          import { chromium } from 'playwright-core';
          import { readFileSync } from 'fs';
          const html = readFileSync('/tmp/demo-preview.html', 'utf8');
          const has7 = ['界面改动','流程变化','系统流程','数据库变更','中间件变更','后端变化','反馈'].every(t => html.includes(t));
          if (!has7) { console.error('tabs text missing'); process.exit(1); }
          const b = await chromium.launch();
          const p = await b.newPage();
          const errs = [];
          p.on('pageerror', e => errs.push(String(e)));
          await p.goto('file:///tmp/demo-preview.html');
          await p.waitForTimeout(2500);
          const tabs = await p.evaluate(() => document.querySelectorAll('nav.tabs button').length);
          console.log(JSON.stringify({ tabs, errs }));
          await b.close();
          if (errs.length || tabs < 5) process.exit(1);
          console.log('runtime smoke ✔');
          SMOKE
          node /tmp/smoke.mjs
